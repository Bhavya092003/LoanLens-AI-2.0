services:
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    environment:
      NEON_DATABASE_URL: ${NEON_DATABASE_URL:?Set NEON_DATABASE_URL in .env}
      NEON_DATABASE_USERNAME: ${NEON_DATABASE_USERNAME:?Set NEON_DATABASE_USERNAME in .env}
      NEON_DATABASE_PASSWORD: ${NEON_DATABASE_PASSWORD:?Set NEON_DATABASE_PASSWORD in .env}
      NEON_CONNECTION_TIMEOUT: ${NEON_CONNECTION_TIMEOUT:-10000}
      CUSTOMER_USERNAME: ${CUSTOMER_USERNAME:-customer}
      CUSTOMER_PASSWORD: ${CUSTOMER_PASSWORD:?Set CUSTOMER_PASSWORD in .env}
      REVIEWER_USERNAME: ${REVIEWER_USERNAME:-reviewer}
      REVIEWER_PASSWORD: ${REVIEWER_PASSWORD:?Set REVIEWER_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      JWT_LIFETIME: ${JWT_LIFETIME:-PT8H}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_CHAT_MODEL: ${OPENAI_CHAT_MODEL:-gpt-4o-mini}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      OPENAI_EMBEDDING_DIMENSIONS: ${OPENAI_EMBEDDING_DIMENSIONS:-1536}
      OCR_PROVIDER: ${OCR_PROVIDER:-ocr-space}
      OCR_SPACE_API_KEY: ${OCR_SPACE_API_KEY:-}
      OCR_SPACE_API_URL: ${OCR_SPACE_API_URL:-https://api.ocr.space/parse/image}
      OCR_SPACE_LANGUAGE: ${OCR_SPACE_LANGUAGE:-eng}
      OCR_SPACE_ENGINE: ${OCR_SPACE_ENGINE:-2}
      OCR_PROVIDER_TIMEOUT: ${OCR_PROVIDER_TIMEOUT:-20s}
      AI_PROVIDER_TIMEOUT: ${AI_PROVIDER_TIMEOUT:-20s}
      POLICY_CHUNK_SIZE: ${POLICY_CHUNK_SIZE:-1200}
      POLICY_CHUNK_OVERLAP: ${POLICY_CHUNK_OVERLAP:-150}
      POLICY_RETRIEVAL_TOP_K: ${POLICY_RETRIEVAL_TOP_K:-5}
      POLICY_MINIMUM_SIMILARITY: ${POLICY_MINIMUM_SIMILARITY:-0.25}
      FLYWAY_ENABLED: ${FLYWAY_ENABLED:-false}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:5173}
      POLICY_STORAGE_DIR: ${POLICY_STORAGE_DIR:-/var/lib/lending/policies}
      APPLICATION_STORAGE_DIR: ${APPLICATION_STORAGE_DIR:-/var/lib/lending/applications}
      APPLICATION_MAX_FILE_SIZE: ${APPLICATION_MAX_FILE_SIZE:-10MB}
      POLICY_MAX_FILE_SIZE: ${POLICY_MAX_FILE_SIZE:-20MB}
      POLICY_MAX_REQUEST_SIZE: ${POLICY_MAX_REQUEST_SIZE:-21MB}
      POLICY_MAX_PAGES: ${POLICY_MAX_PAGES:-500}
      POLICY_MAX_EXTRACTED_CHARACTERS: ${POLICY_MAX_EXTRACTED_CHARACTERS:-10000000}
    volumes:
      - policy-document-storage:/var/lib/lending
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"

volumes:
  policy-document-storage:
