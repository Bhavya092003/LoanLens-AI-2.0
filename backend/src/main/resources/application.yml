server:
  port: ${BACKEND_PORT:8080}

spring:
  application:
    name: digital-lending-platform
  servlet:
    multipart:
      max-file-size: ${POLICY_MAX_FILE_SIZE:20MB}
      max-request-size: ${POLICY_MAX_REQUEST_SIZE:21MB}
  datasource:
    url: ${NEON_DATABASE_URL}
    username: ${NEON_DATABASE_USERNAME}
    password: ${NEON_DATABASE_PASSWORD}
    hikari:
      connection-timeout: ${NEON_CONNECTION_TIMEOUT:10000}
      initialization-fail-timeout: -1
  jpa:
    open-in-view: false
    database: postgresql
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        boot:
          allow_jdbc_metadata_access: false
        jdbc:
          time_zone: UTC
  flyway:
    enabled: ${FLYWAY_ENABLED:false}
    locations: classpath:db/migration

app:
  auth:
    reviewer-username: ${REVIEWER_USERNAME:}
    reviewer-password: ${REVIEWER_PASSWORD:}
    jwt-secret: ${JWT_SECRET}
    jwt-lifetime: ${JWT_LIFETIME:PT8H}
  application-storage:
    directory: ${APPLICATION_STORAGE_DIR:/var/lib/lending/applications}
    max-file-size: ${APPLICATION_MAX_FILE_SIZE:10MB}
  ai:
    api-key: ${OPENAI_API_KEY:}
    base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
    chat-model: ${OPENAI_CHAT_MODEL:gpt-4o-mini}
    embedding-model: ${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}
    embedding-dimensions: ${OPENAI_EMBEDDING_DIMENSIONS:1536}
    timeout: ${AI_PROVIDER_TIMEOUT:20s}
  ocr:
    provider: ${OCR_PROVIDER:ocr-space}
    api-key: ${OCR_SPACE_API_KEY:}
    api-url: ${OCR_SPACE_API_URL:https://api.ocr.space/parse/image}
    language: ${OCR_SPACE_LANGUAGE:eng}
    engine: ${OCR_SPACE_ENGINE:2}
    timeout: ${OCR_PROVIDER_TIMEOUT:20s}
  policy-retrieval:
    chunk-size: ${POLICY_CHUNK_SIZE:1200}
    chunk-overlap: ${POLICY_CHUNK_OVERLAP:150}
    top-k: ${POLICY_RETRIEVAL_TOP_K:5}
    minimum-similarity: ${POLICY_MINIMUM_SIMILARITY:0.25}
  policy-storage:
    directory: ${POLICY_STORAGE_DIR:/var/lib/lending/policies}
    max-file-size: ${POLICY_MAX_FILE_SIZE:20MB}
    max-pages: ${POLICY_MAX_PAGES:500}
    max-extracted-characters: ${POLICY_MAX_EXTRACTED_CHARACTERS:10000000}
  cors:
    allowed-origin: ${FRONTEND_ORIGIN:http://localhost:5173}
